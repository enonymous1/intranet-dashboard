name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check and test before publishing
        run: npm run check && npm test
      # Gate the publish on the browser smoke test, not just unit tests:
      # a broken layout must never reach Pages again (v1.1.0 did).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Browser smoke test (GridStack layout + fallback layout)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run smoke
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
