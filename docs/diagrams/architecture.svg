<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <style>
    .box { fill: #eef4fb; stroke: #4a7fb5; stroke-width: 1.5; rx: 8; }
    .box2 { fill: #f4f4f4; stroke: #888; stroke-width: 1.5; rx: 8; }
    .title { font-weight: 700; }
    .small { font-size: 11px; fill: #444; }
    line, path { stroke: #555; stroke-width: 1.5; }
  </style>
  <!-- Top -->
  <rect class="box" x="330" y="10" width="240" height="56"/>
  <text class="title" x="450" y="32" text-anchor="middle">index.html</text>
  <text class="small" x="450" y="50" text-anchor="middle">CDN scripts + SRI, dialog, grid container</text>
  <!-- App -->
  <rect class="box" x="330" y="100" width="240" height="56"/>
  <text class="title" x="450" y="122" text-anchor="middle">app.js (DashboardApp)</text>
  <text class="small" x="450" y="140" text-anchor="middle">start(): services, modules, UI — never blocks</text>
  <line x1="450" y1="66" x2="450" y2="100" marker-end="url(#arrow)"/>
  <!-- Config / Emitter -->
  <rect class="box2" x="40" y="190" width="200" height="56"/>
  <text class="title" x="140" y="212" text-anchor="middle">Config</text>
  <text class="small" x="140" y="230" text-anchor="middle">null-by-default integrations</text>
  <rect class="box2" x="660" y="190" width="200" height="56"/>
  <text class="title" x="760" y="212" text-anchor="middle">EventEmitter</text>
  <text class="small" x="760" y="230" text-anchor="middle">pub/sub between modules</text>
  <line x1="330" y1="190" x2="240" y2="190" marker-end="url(#arrow)"/>
  <line x1="570" y1="190" x2="660" y2="190" marker-end="url(#arrow)"/>
  <!-- Modules row -->
  <rect class="box" x="40" y="280" width="180" height="56"/>
  <text class="title" x="130" y="302" text-anchor="middle">AuthModule</text>
  <text class="small" x="130" y="320" text-anchor="middle">optional MSAL</text>
  <rect class="box" x="250" y="280" width="180" height="56"/>
  <text class="title" x="340" y="302" text-anchor="middle">DashboardModule</text>
  <text class="small" x="340" y="320" text-anchor="middle">registry + grid adapter</text>
  <rect class="box" x="460" y="280" width="180" height="56"/>
  <text class="title" x="550" y="302" text-anchor="middle">ThemeModule</text>
  <text class="small" x="550" y="320" text-anchor="middle">dark / light</text>
  <rect class="box" x="670" y="280" width="190" height="56"/>
  <text class="title" x="765" y="302" text-anchor="middle">WidgetFactory</text>
  <text class="small" x="765" y="320" text-anchor="middle">all five widget types</text>
  <line x1="450" y1="156" x2="450" y2="280" marker-end="url(#arrow)"/>
  <!-- Services row -->
  <rect class="box2" x="40" y="380" width="180" height="56"/>
  <text class="title" x="130" y="402" text-anchor="middle">ChartService</text>
  <text class="small" x="130" y="420" text-anchor="middle">Chart.js wrapper</text>
  <rect class="box2" x="250" y="380" width="180" height="56"/>
  <text class="title" x="340" y="402" text-anchor="middle">LayoutStore</text>
  <text class="small" x="340" y="420" text-anchor="middle">local or Firebase, one interface</text>
  <rect class="box2" x="460" y="380" width="180" height="56"/>
  <text class="title" x="550" y="402" text-anchor="middle">FirebaseService</text>
  <text class="small" x="550" y="420" text-anchor="middle">optional Firestore</text>
  <line x1="340" y1="336" x2="340" y2="380" marker-end="url(#arrow)"/>
  <line x1="550" y1="336" x2="550" y2="380" marker-end="url(#arrow)"/>
  <!-- Stores / CDN -->
  <rect class="box2" x="40" y="470" width="180" height="40"/>
  <text x="130" y="495" text-anchor="middle">localStorage (default)</text>
  <rect class="box2" x="250" y="470" width="180" height="40"/>
  <text x="340" y="495" text-anchor="middle">Firestore (when configured)</text>
  <rect class="box2" x="670" y="470" width="190" height="40"/>
  <text x="765" y="495" text-anchor="middle">GridStack · Chart.js · MSAL</text>
  <line x1="340" y1="436" x2="340" y2="470" marker-end="url(#arrow)"/>
  <line x1="550" y1="436" x2="430" y2="470" marker-end="url(#arrow)"/>
</svg>
